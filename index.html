<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Intake Tracker</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f8f9fa; color: #212529; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 720px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 1.25rem; margin: 0; }
    button { cursor: pointer; border: 1px solid #ced4da; background: #fff; padding: 8px 12px; border-radius: 4px; font-weight: 600; }
    button:hover { background: #e9ecef; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    
    .card { background: #fff; border: 1px solid #dee2e6; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
    .card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .card-head h2 { font-size: 1rem; margin: 0; }
    .vessel-row { display: flex; gap: 12px; min-height: 180px; align-items: flex-end; justify-content: center; overflow-x: auto; padding: 10px 0; background: #fafafa; border: 1px solid #eee; border-radius: 4px; }
    
    .vessel { width: 70px; height: 140px; border: 2px solid #6c757d; border-radius: 0 0 10px 10px; position: relative; display: flex; align-items: flex-end; overflow: hidden; background: #fff; }
    .water-fill { width: 100%; background: #0ea5e9; transition: height 0.2s ease; }
    .cal-fill { width: 100%; background: #f59e0b; transition: height 0.2s ease; }
    .vessel-label { font-size: 11px; text-align: center; margin-top: 4px; color: #6c757d; }
    
    .btn-row { display: flex; gap: 6px; margin-top: 12px; }
    .btn-row button { flex: 1; }
    .sub-link { font-size: 12px; color: #0d6efd; text-decoration: none; display: block; margin-top: 8px; text-align: right; }
    .sub-link:hover { text-decoration: underline; }

    .checklist { background: #fff; border: 1px solid #dee2e6; border-radius: 6px; padding: 16px; }
    .check-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 10px; }
    .check-item { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
    .check-item input { width: 16px; height: 16px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1 id="dateDisplay">Tracker</h1>
    <button id="resetBtn" style="color: #dc3545; border-color: #f5c2c7; background: #f8d7da;">Reset Day</button>
  </header>

  <div class="grid">
    <!-- WATER -->
    <div class="card">
      <div>
        <div class="card-head">
          <h2>Water</h2>
          <span id="waterStats" style="font-size: 13px; font-weight: 600;">0 / 64 fl oz</span>
        </div>
        <div id="waterContainer" class="vessel-row"></div>
      </div>
      <div class="btn-row">
        <button id="addWaterBtn" style="background: #0ea5e9; color: #fff; border-color: #0284c7;">+ 10 fl oz</button>
        <button id="undoWaterBtn" style="flex: 0 0 auto;">-10</button>
      </div>
    </div>

    <!-- CALORIES -->
    <div class="card">
      <div>
        <div class="card-head">
          <h2>Calories</h2>
          <span id="calStats" style="font-size: 13px; font-weight: 600;">0 / 1800 kcal</span>
        </div>
        <div id="calContainer" class="vessel-row"></div>
      </div>
      <div>
        <div class="btn-row">
          <button onclick="addCalories(100)">+100</button>
          <button onclick="addCalories(200)">+200</button>
          <button onclick="addCalories(300)">+300</button>
          <button onclick="addCalories(400)">+400</button>
          <button onclick="addCalories(500)">+500</button>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
          <button onclick="undoCalories()" style="padding: 4px 8px; font-size: 12px;">Undo -100</button>
          <a class="sub-link" href="https://www.calorieking.com/us/en/foods/" target="_blank" rel="noopener noreferrer">Lookup Food Calories &rarr;</a>
        </div>
      </div>
    </div>
  </div>

  <!-- SUPPLEMENTS -->
  <div class="checklist">
    <h2 style="font-size: 14px; margin: 0 0 8px 0;">Supplements</h2>
    <div class="check-grid">
      <label class="check-item"><input type="checkbox" id="supp_fish_oil"> Fish Oil</label>
      <label class="check-item"><input type="checkbox" id="supp_vitamins"> Vitamins</label>
      <label class="check-item"><input type="checkbox" id="supp_fiber"> Fiber</label>
      <label class="check-item"><input type="checkbox" id="supp_creatine"> Creatine</label>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'daily_tracker_data';
  const WATER_MAX = 64; // 0.5 gallon = 64 fl oz
  const CAL_MAX = 1800;

  let state = {
    date: getTodayStr(),
    waterOz: 0,
    calories: 0,
    supplements: { fish_oil: false, vitamins: false, fiber: false, creatine: false }
  };

  function getTodayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function loadState() {
    const raw = localStorage.getItem(STORAGE_KEY);
    const today = getTodayStr();
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        if (parsed.date === today) {
          state = parsed;
          return;
        }
      } catch (e) {}
    }
    resetState(today);
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function resetState(date = getTodayStr()) {
    state = {
      date: date,
      waterOz: 0,
      calories: 0,
      supplements: { fish_oil: false, vitamins: false, fiber: false, creatine: false }
    };
    saveState();
  }

  function addWater() {
    state.waterOz += 10;
    saveState();
    renderWater();
  }

  function undoWater() {
    state.waterOz = Math.max(0, state.waterOz - 10);
    saveState();
    renderWater();
  }

  function renderWater() {
    document.getElementById('waterStats').textContent = `${state.waterOz} / ${WATER_MAX} fl oz`;
    const box = document.getElementById('waterContainer');
    box.innerHTML = '';

    const count = Math.max(1, Math.ceil(state.waterOz / WATER_MAX));
    for (let i = 0; i < count; i++) {
      const current = Math.max(0, Math.min(WATER_MAX, state.waterOz - (i * WATER_MAX)));
      const pct = Math.min(100, Math.round((current / WATER_MAX) * 100));

      const wrapper = document.createElement('div');
      wrapper.innerHTML = `
        <div class="vessel"><div class="water-fill" style="height: ${pct}%;"></div></div>
        <div class="vessel-label">${count > 1 ? `Cup #${i + 1}: ` : ''}${current} oz</div>
      `;
      box.appendChild(wrapper);
    }
  }

  function addCalories(n) {
    state.calories += n;
    saveState();
    renderCalories();
  }

  function undoCalories() {
    state.calories = Math.max(0, state.calories - 100);
    saveState();
    renderCalories();
  }

  function renderCalories() {
    document.getElementById('calStats').textContent = `${state.calories} / ${CAL_MAX} kcal`;
    const box = document.getElementById('calContainer');
    box.innerHTML = '';

    const count = Math.max(1, Math.ceil(state.calories / CAL_MAX));
    for (let i = 0; i < count; i++) {
      const current = Math.max(0, Math.min(CAL_MAX, state.calories - (i * CAL_MAX)));
      const pct = Math.min(100, Math.round((current / CAL_MAX) * 100));

      const wrapper = document.createElement('div');
      wrapper.innerHTML = `
        <div class="vessel" style="border-color: #b45309;"><div class="cal-fill" style="height: ${pct}%;"></div></div>
        <div class="vessel-label">${count > 1 ? `Cup #${i + 1}: ` : ''}${current} kcal</div>
      `;
      box.appendChild(wrapper);
    }
  }

  function renderSupplements() {
    ['fish_oil', 'vitamins', 'fiber', 'creatine'].forEach(key => {
      const el = document.getElementById(`supp_${key}`);
      el.checked = !!state.supplements[key];
      el.onchange = (e) => {
        state.supplements[key] = e.target.checked;
        saveState();
      };
    });
  }

  function checkMidnight() {
    if (state.date !== getTodayStr()) {
      loadState();
      renderAll();
    }
  }

  function renderAll() {
    document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    renderWater();
    renderCalories();
    renderSupplements();
  }

  window.onload = function() {
    loadState();
    renderAll();

    document.getElementById('addWaterBtn').onclick = addWater;
    document.getElementById('undoWaterBtn').onclick = undoWater;
    document.getElementById('resetBtn').onclick = () => {
      resetState();
      renderAll();
    };

    setInterval(checkMidnight, 30000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) checkMidnight();
    });
  };
</script>
</body>
</html>
